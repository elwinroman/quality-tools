services:
  valkey:
    image: valkey/valkey:8.0.2-alpine3.21
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "yes", "--loglevel", "notice", "--requirepass", "${VALKEY_PASSWORD}"]
    cpus: "0.50"
    mem_limit: 256m
    mem_reservation: 128m
    ports:
      - "${VALKEY_PORT}:6379"
    volumes:
      - valkey_data:/data
    env_file:
      - .env.valkey
    restart: unless-stopped

  backend:
    image: qt-backend:${APP_VERSION:-latest}
    build:
      context: ./api
    cpus: "1.00"
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      - NODE_ENV=production
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${DOMAIN}:${CLIENT_PORT}}
    env_file:
      - .env
    depends_on:
      - valkey
    restart: unless-stopped
    networks:
      - default       # Red interna (comunicación con valkey, frontend)
      - monitor       # Red externa para Loki (logs)

  frontend:
    image: qt-frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${DOMAIN}:${BACKEND_PORT}
    cpus: "0.50"
    mem_limit: 128m
    mem_reservation: 64m
    ports:
      - "${CLIENT_PORT}:80"
    environment:
      - VITE_API_URL=${DOMAIN}:${BACKEND_PORT}
    depends_on:
      - backend
    restart: unless-stopped
    
volumes:
  valkey_data:
    driver: local

networks:
  monitor:
    name: monitoring
    external: true
