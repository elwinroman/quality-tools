name: Frontend tests

on:
  push:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'

# Cancel the previous run when a newer push arrives.
concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # `src/enviroment/enviroment.ts` reads `import.meta.env` with safe fallbacks,
    # so no environment variables are required: nothing connects to a backend.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # The monaco theme registry is generated; fail if it drifts from source.
      - name: Themes check
        run: pnpm run themes:check

      - name: Unit tests
        run: pnpm run test:run

      # Corre la suite otra vez en orden aleatorio: un test que solo pasa por
      # depender del orden de ejecucion tiene que fallar aca, no meses despues.
      - name: Unit tests (random order)
        run: pnpm exec vitest run --sequence.shuffle

      # The chunk-size warning is expected with Monaco and is not fatal.
      - name: Build
        run: pnpm run build
